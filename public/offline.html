<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#071018" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="color-scheme" content="dark" />
    <title>Peugeot Control</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #071018;
        color: #eef6f8;
        color-scheme: dark;
      }
      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #071018;
        color: #eef6f8;
      }
      .boot-copy {
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .boot-label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: #5fe3c0;
        margin: 0 0 0 -0.36em;
      }
      .boot-sub {
        margin-top: 0.7rem;
        font-size: 13px;
        color: rgba(143, 168, 181, 0.9);
        letter-spacing: 0.02em;
      }
      .boot-hint {
        margin-top: 1.25rem;
        font-size: 12px;
        color: rgba(143, 168, 181, 0.65);
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" role="status">
      <div class="boot-copy">
        <div class="boot-label">Peugeot</div>
        <div class="boot-sub">Kein Netz</div>
        <div class="boot-hint">Tippen zum erneuten Versuch</div>
      </div>
    </div>
    <script>
      (function () {
        function retry() {
          location.reload();
        }
        document
          .getElementById("app-boot-splash")
          .addEventListener("click", retry);
        window.addEventListener("online", retry, { once: true });
      })();
    </script>
  </body>
</html>
